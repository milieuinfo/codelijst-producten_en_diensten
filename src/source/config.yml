    description: "Catalogus van datasets van codelijsten die onder het domein data.omgeving.vlaanderen.be gepubliceerd worden."
    uri : https://data.omgeving.vlaanderen.be/id/catalog/codelijst
    type: http://www.w3.org/ns/dcat#Catalog
  dataset :
    title: "Dataset van de producten en diensten van het Departement Omgeving: codelijst en publieke dienstverlening (CPSV-AP)."
    description: "Deze dataset bevat de producten- en dienstencatalogus (PDC) van het Departement Omgeving in twee vormen. Als SKOS-codelijst is de catalogus functioneel opgebouwd in drie niveaus: dienst 1, dienst 2 en dienst 3, waarbij de diensten van niveau 3 gegroepeerd zijn in collecties volgens type dienst (kern of omkaderend), fase in de beleidscyclus, betrokken afdeling, intern of extern gericht en interne of externe trigger. Volgens CPSV-AP 3.2.0 is elke dienst van niveau 3 een publieke dienst (cpsv:PublicService), geclassificeerd door het overeenkomstige concept uit de codelijst, met de producten als output (cv:Output), het Departement Omgeving als bevoegde overheid en de betrokken afdelingen als participatie (cv:Participation). De beschrijvingen van de diensten zijn voorlopig plaatshouders."
    temporal : https://data.omgeving.vlaanderen.be/id/periodoftime/dataset_omg
    type : http://www.w3.org/ns/dcat#Dataset
    provenance:
      label: "Deze codelijst is afgeleid uit de producten- en dienstencatalogus van het Departement Omgeving (bronbestand 250804_PDC_DOMG.xlsx, tabblad PDI OMG, versie 4 augustus 2025)."
