      format: http://publications.europa.eu/resource/authority/file-type/JSON
      type: http://www.w3.org/ns/dcat#Distribution
    ttl:
      title: "Producten en diensten van het Departement Omgeving (codelijst en CPSV-AP), geserialiseerd als turtle-formaat."
      description: "Producten en diensten van het Departement Omgeving (codelijst en CPSV-AP), geserialiseerd als turtle-bestand."
